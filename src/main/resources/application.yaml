server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finaldb
    driver-class-name: org.postgresql.Driver
    username: admin
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092

  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 10s
    socket-timeout: 30s

  logging:
    level:
      root: DEBUG

kafka:
  topic:
    name: message-topic
    dlt-name: message-topic.DLT
